const SFX={coin:[1300,1900,.06,'triangle'],clang:[1500,900,.1,'square'],bubble:[700,260,.12,'sine'],spit:[500,220,.09,'triangle'],zap:[1200,500,.08,'square'],jump:[520,780,.08,'triangle'],swing:[320,160,.07,'sawtooth'],hit:[220,90,.1,'square'],ink:[420,140,.13,'sine'],hurt:[180,60,.25,'square'],pick:[660,1320,.22,'triangle'],brk:[260,70,.22,'sawtooth'],invis:[900,300,.3,'sine'],save:[440,880,.35,'sine'],boss:[110,55,.6,'sawtooth'],warp:[200,900,.5,'triangle']};
function sfx(n){if(!AC||muted)return;const P=SFX[n];if(!P)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=P[3];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0008,t+P[2]);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+P[2]+.03);}catch(e){}}

const SAVE_KEY='otto-polvo-save-v2';
function newSave(){return{ab:{ink:false,climb:false,invis:false},maxHp:5,inkMax:6,shells:0,got:{},broken:{},bosses:{},bench:{room:1,x:12,y:19},visited:{},kills:0,deaths:0,time:0,won:0,coins:0,acc:{},eq:{},bolsa:0};}
function acc(k){return !!(save&&save.acc&&save.acc[k]&&save.eq&&save.eq[k]);}
function eqCount(){return Object.keys(save.eq||{}).filter(k=>save.eq[k]&&save.acc[k]).length;}
function gearOf(){const g={};if(save&&save.eq)for(const k in save.eq)if(acc(k))g[k]=1;return g;}
function fixEq(){if(!save.eq){save.eq={};let n=0;for(const k in save.acc)if(save.acc[k]&&n<slots()){save.eq[k]=1;n++;}}}
function maxHP(){return save.maxHp+(acc('coracao')?1:0);}
function slots(){return 3+(save.bolsa?1:0)+(save.extraSlot?1:0);}
function accCount(){return Object.keys(save.acc||{}).filter(k=>save.acc[k]).length;}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
function readSave(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ================= TILES & FÍSICA ================= */
function isWall(c){return c==='#'||c==='C'||c==='L'||(c==='D'&&save.shells<3);}
function solidTile(tx,ty){if(tx<0||ty<0||tx>=W||ty>=H)return locked;return isWall(grid[ty][tx]);}
function hitSolid(x,y,w,h){const x0=Math.floor(x/T),x1=Math.floor((x+w-.001)/T),y0=Math.floor(y/T),y1=Math.floor((y+h-.001)/T);for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidTile(tx,ty))return true;return false;}
function oneWayCross(o,pb,nb){const r=Math.floor((nb-.001)/T),top=r*T;if(!(pb<=top+.01&&nb>top))return false;if(r<0||r>=H)return false;const x0=Math.floor(o.x/T),x1=Math.floor((o.x+o.w-.001)/T);for(let tx=x0;tx<=x1;tx++)if(tx>=0&&tx<W&&grid[r][tx]==='-')return true;return false;}
function moveX(o,dx){const s=Math.sign(dx);let rem=Math.abs(dx);while(rem>0){const st=Math.min(1,rem);o.x+=s*st;if(hitSolid(o.x,o.y,o.w,o.h)){o.x-=s*st;return true;}rem-=st;}return false;}
function moveY(o,dy){const s=Math.sign(dy);let rem=Math.abs(dy);while(rem>0){const st=Math.min(1,rem);const pb=o.y+o.h;o.y+=s*st;if(hitSolid(o.x,o.y,o.w,o.h)||(s>0&&!(o.drop>0)&&oneWayCross(o,pb,o.y+o.h))){o.y-=s*st;return true;}rem-=st;}return false;}
function groundAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=W||ty>=H)return false;const c=grid[ty][tx];return isWall(c)||c==='-';}
function tileAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=W||ty>=H)return '';return grid[ty][tx];}

function burst(x,y,c,n,sp,g){const rbw=c==='rainbow';for(let i=0;i<n;i++){if(rbw)c=`hsl(${Math.floor(Math.random()*360)},100%,65%)`;const a=Math.random()*Math.PI*2,s=(0.4+Math.random())*(sp||2.5);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*25,max:55,c,r:1.5+Math.random()*2.5,g:g===undefined?0.04:g});}}
function puff(){burst(p.x+p.w/2,p.y+p.h,'rgba(220,210,255,.7)',6,1.2,-0.02);}
function shake(m){shakeT=12;shakeM=Math.max(m,shakeT>0?shakeM:0);}
function toast(text,t){toasts.push({text,t:t||200});if(toasts.length>3)toasts.shift();}
function updateParts(){for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.vx*=0.97;q.life--;}parts=parts.filter(q=>q.life>0);if(parts.length>400)parts.splice(0,parts.length-400);}

function loadRoom(id){
 room=ROOMS[id];grid=G();room.build(grid);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]==='C'&&save.broken[id+':'+x+','+y])grid[y][x]='.';
 enemies=[];shots=[];eshots=[];items=[];orbs=[];boss=null;parts=[];chal=null;darkT=0;
 for(const [t,x,y] of room.ents){if(t==='pearl'||t==='shell'||t==='chest'){const key=id+':'+t+':'+x+','+y;if(!save.got[key])items.push({t,x:x*T+T/2,y:y*T+T/2,key,ph:x+y});}else enemies.push(makeEnemy(t,x,y));}
 if(room.boss){if(!save.bosses[id])boss=makeBoss(room.boss);else{const ab=BOSS[room.boss].ab;if(ab&&!save.ab[ab])orbs.push({x:room.arenaMin?26*T:VW/2,y:17*T,ab,t:0,ready:false});
  const rw=BOSS[room.boss].reward;if(rw&&!save.got['trophy:'+id])orbs.push({x:VW/2,y:17*T,reward:rw,key:'trophy:'+id,t:0,ready:true});}}
 locked=!!boss;
 beams=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]==='L'){let yy=y+1;while(yy<H&&!isWall(grid[yy][x]))yy++;beams.push({x:x*T-3,y:(y+1)*T,w:T+6,h:(yy-y-1)*T});}
 decor=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(grid[y][x]==='.'&&grid[y+1][x]==='#'){const h=hash(x,y,id*7);if(h<0.25)decor.push({x:x*T+6+Math.floor(h*48),y:(y+1)*T,h:14+hash(y,x,id)*26,c:REG[room.region].weed[(x+y)%2]});}}
 renderTiles();renderBg();
 save.visited[id]=1;
 if(boss){banner={text:BOSS[room.boss].name,sub:room.name,t:200,boss:true};sfx('boss');}
 else banner={text:room.name,sub:room.tech?'Algo aqui distorce o espaço...':'',t:170};
 if(room.tech){cam3.x=VW/2;cam3.y=VH/2;cam3.yaw=0;cam3.pitch=0;cam3.zoom=1;cam3.tt=0;sfx('warp');}
 if(id===14&&save.shells>=3&&!save.gateMsg){save.gateMsg=1;toast('As três conchas brilham... o portão se abriu!');}
}
function checkExit(){
 const cx=p.x+p.w/2,cy=p.y+p.h/2;let dx=0,dy=0;
 if(cx<0)dx=-1;else if(cx>VW)dx=1;else if(cy<0)dy=-1;else if(cy>VH)dy=1;else return;
 const n=locked?null:byPos[(room.gx+dx)+','+(room.gy+dy)];
 if(!n){p.x=clamp(p.x,-p.w/2+1,VW-p.w/2-1);p.y=clamp(p.y,-p.h/2+1,VH-p.h/2-1);return;}
 loadRoom(n.id);
 if(dx===-1)p.x=VW-p.w-2;if(dx===1)p.x=2;
 if(dy===-1){p.y=VH-p.h-2;if(!p.cling){p.vy=Math.min(p.vy,-8.5);p.jumping=false;}}
 if(dy===1)p.y=2;
 if(hitSolid(p.x,p.y,p.w,p.h)){outer:for(let r=2;r<=72;r+=2)for(const [ox,oy] of [[0,-r],[0,r],[r,0],[-r,0]])if(!hitSolid(p.x+ox,p.y+oy,p.w,p.h)){p.x+=ox;p.y+=oy;break outer;}}
 p.safe={x:p.x,y:p.y};fade=10;
}

function makeEnemy(t,tx,ty){const e=makeEnemy0(t,tx,ty);e.mhp=e.hp;return e;}
function makeEnemy0(t,tx,ty){const x=tx*T,y=ty*T,dir=hash(tx,ty,5)<.5?-1:1,ph=hash(tx,ty,4)*200;
 if(t==='seahorse')return{t,x:x+3,y,w:18,h:28,hp:3,bx:x+3,by:y,ph,flash:0,kx:0};
 if(t==='urchin')return{t,x,y:y+2,w:24,h:22,hp:4,vx:dir*1.3,vy:0,flash:0,kx:0,ph:0,og:false};
 if(t==='salamander')return{t,x:x-3,y:y+8,w:30,h:16,hp:4,vx:dir*.9,vy:0,flash:0,kx:0,ph,og:false};
 if(t==='sandcrab')return{t,x,y:y+8,w:24,h:16,hp:2,vx:dir*1.6,vy:0,flash:0,kx:0,ph,og:false,bur:100+ph,up:0};
 if(t==='lanternfish'||t==='firefish')return{t,x:x+2,y:y+3,w:26,h:18,hp:3,vx:dir*1.2,vy:0,by:y+3,ph,flash:0,kx:0,dashT:0};
 if(t==='gull')return{t,x,y:y+4,w:30,h:16,hp:2,vx:dir*1.6,by:y+4,ph,flash:0,kx:0,dive:0};
 if(t==='rolinha')return{t,x,y:y+6,w:16,h:12,hp:1,vx:dir*1.4,by:y+6,ph,flash:0,kx:0};
 if(t==='lavabubble')return{t,x:x+3,y:y+3,w:18,h:18,hp:2,by:y+3,vy:0,hidden:true,wait:hash(tx,ty,6)*120,flash:0,kx:0,ph};
 if(t==='turret')return{t,x,y:y+4,w:24,h:20,hp:5,flash:0,kx:0,ph};
 if(t==='fish'||t==='drone')return{t,x:x+2,y:y+3,w:26,h:18,hp:t==='drone'?3:2,vx:dir*1.2,vy:0,by:y+3,ph:hash(ty,tx,2)*60,flash:0,kx:0};
 if(t==='crab')return{t,x:x-2,y:y+6,w:28,h:18,hp:3,vx:dir*.8,vy:0,flash:0,kx:0,ph:0,og:false};
 return{t:'jelly',x:x+1,y,w:22,h:24,hp:2,by:y,bx:x+1,ph:hash(tx,ty,3)*200,flash:0,kx:0};}
function dropCoins(x,y,n,v){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,sp=2+Math.random()*3;items.push({t:'coin',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,v:v||1,life:900,ph:Math.random()*6});}}
function hitEnemy(e,d,dir){if(e.bur>0||e.hidden){burst(e.x+e.w/2,e.y+e.h/2,'#e9d8a6',4,1.5);return;}e.hp-=d;e.flash=20;e.kx=dir*4;burst(e.x+e.w/2,e.y+e.h/2,'rainbow',10,2.5);sfx('hit');
 if(e.hp<=0&&!e.dead){e.dead=true;save.kills++;if(e.t==='urchin')for(let i=0;i<6;i++){const a=i/6*Math.PI*2;eshots.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:Math.cos(a)*3,vy:Math.sin(a)*3,r:5,life:60,k:'spike'});}burst(e.x+e.w/2,e.y+e.h/2,'#fff',12,3);
  if(Math.random()<(acc('sorte')?.35:.2))items.push({t:'heart',x:e.x+e.w/2,y:e.y+e.h/2,vy:-3.5,life:720,ph:0});
  dropCoins(e.x+e.w/2,e.y+e.h/2,(e.t==='drone'?2:1)+Math.floor(Math.random()*2)+(acc('sorte')?1:0),1);
  if(save.ab.ink&&save.kills%12===0&&save.inkMax<9){save.inkMax++;p.ink=save.inkMax;toast('Inimigos derrotados: '+save.kills+'. +1 gota de tinta máxima!');writeSave();}}}
function enemyShoot(e,pcx,pcy,vis){const ex=e.x+e.w/2,ey=e.y+e.h/2,d=Math.hypot(pcx-ex,pcy-ey);
 if(e.t==='urchin'||e.t==='lavabubble'||e.bur>0||e.hidden||e.dive>0||e.dashT>0)return;
 if(e.cd===undefined)e.cd=60+Math.random()*140;
 if(e.tell>0){e.tell--;if(e.tell===0){fireEnemy(e,pcx,pcy);e.cd=(e.t==='jelly'?230:190)+Math.random()*110;}return;}
 const range=e.t==='jelly'?190:e.t==='crab'?300:280;
 if(vis&&d<range&&state==='play'){if(--e.cd<=0)e.tell=30;}}
function fireEnemy(e,pcx,pcy){const ex=e.x+e.w/2,ey=e.y+e.h/2,a=Math.atan2(pcy-ey,pcx-ex);
 if(e.t==='fish'){eshots.push({x:ex+Math.cos(a)*12,y:ey+Math.sin(a)*12,vx:Math.cos(a)*4.6,vy:Math.sin(a)*4.6,r:5,life:90,k:'jet'});e.vx=Math.cos(a)>=0?Math.abs(e.vx):-Math.abs(e.vx);sfx('spit');}
 else if(e.t==='drone'){for(const o of [-.12,.12])eshots.push({x:ex,y:ey,vx:Math.cos(a+o)*5.5,vy:Math.sin(a+o)*5.5,r:4,life:100,k:'zap'});sfx('zap');}
 else if(e.t==='crab'){const t=48,g=.22,vx=clamp((pcx-ex)/t,-4.5,4.5),vy=clamp((pcy-ey-.5*g*t*t)/t,-9,-3);eshots.push({x:ex,y:e.y-4,vx,vy,r:7,life:160,k:'lob',g});sfx('bubble');}
 else if(e.t==='seahorse'){for(const o of [-.25,0,.25])eshots.push({x:ex,y:ey,vx:Math.cos(a+o)*3.2,vy:Math.sin(a+o)*3.2,r:6,life:140,k:'bubble'});sfx('bubble');}
 else if(e.t==='lanternfish'){e.dashT=26;e.dvx=Math.cos(a)*6.5;e.dvy=Math.sin(a)*6.5;sfx('swing');}
 else if(e.t==='gull'){e.dive=60;e.dvx=Math.cos(a)*5.5;e.dvy=Math.sin(a)*5.5;sfx('swing');}
 else if(e.t==='rolinha'){eshots.push({x:ex,y:ey+6,vx:e.vx*.5,vy:1,g:.2,r:4,life:120,k:'rock'});}
 else if(e.t==='sandcrab'||e.t==='salamander'){const t=44,g=.22,vx=clamp((pcx-ex)/t,-4.5,4.5),vy=clamp((pcy-ey-.5*g*t*t)/t,-9,-3);const n=e.t==='salamander'?2:1;for(let i=0;i<n;i++)eshots.push({x:ex,y:e.y-4,vx:vx+(i?(vx>0?-1:1):0),vy,r:6,life:160,k:e.t==='salamander'?'fire':'sand',g});sfx(e.t==='salamander'?'ink':'bubble');}
 else if(e.t==='firefish'){eshots.push({x:ex,y:ey,vx:Math.cos(a)*4.4,vy:Math.sin(a)*4.4,r:6,life:110,k:'fire'});e.vx=Math.cos(a)>=0?Math.abs(e.vx):-Math.abs(e.vx);sfx('spit');}
 else if(e.t==='turret'){for(const o of [-.15,0,.15])eshots.push({x:ex,y:ey-4,vx:Math.cos(a+o)*6,vy:Math.sin(a+o)*6,r:4,life:110,k:'zap'});sfx('zap');}
 else{for(let i=0;i<4;i++){const b=Math.PI/4+i*Math.PI/2;eshots.push({x:ex,y:ey,vx:Math.cos(b)*2.6,vy:Math.sin(b)*2.6,r:4,life:75,k:'spark'});}sfx('zap');}}
function updateEnemies(){const pcx=p.x+p.w/2,pcy=p.y+p.h/2,vis=p.inv<=0;
 for(const e of enemies){e.ph++;if(e.flash>0)e.flash--;e.kx*=0.8;if(Math.abs(e.kx)<.05)e.kx=0;const ex=e.x+e.w/2,ey=e.y+e.h/2;
  if(e.dashT>0){e.dashT--;if(moveX(e,e.dvx))e.dvx*=-1;if(moveY(e,e.dvy))e.dvy*=-1;e.vx=e.dvx;if(Math.random()<.5)parts.push({x:ex,y:ey,vx:0,vy:0,life:12,max:12,c:e.t==='firefish'?'#ff922b':'#ffe066',r:3,g:0});}
  else if(e.t==='fish'||e.t==='drone'||e.t==='lanternfish'||e.t==='firefish'){const d=Math.hypot(pcx-ex,pcy-ey);
   if(vis&&d<170){e.vx=clamp(e.vx+Math.sign(pcx-ex)*.06,-1.8,1.8);e.vy=clamp(e.vy+Math.sign(pcy-ey)*.05,-1.4,1.4);}

function makeBoss(type){const hp=BOSS[type].hp;const b={type,hp,max:hp,t:0,st:'intro',flash:0};

 if(type==='tubarao')Object.assign(b,{x:VW/2+60,y:20*T-54,w:112,h:54,vx:0,vy:0,face:-1,og:false});
 if(type==='tamboril')Object.assign(b,{cx:VW/2+140,cy:8*T,r:52,vx:0,vy:0,shotT:0,sumT:0,ring:0});
 if(type==='lagosta')Object.assign(b,{x:28*T,y:20*T-40,w:72,h:40,vx:0,vy:0,face:-1,og:false,cyc:0});
 if(type==='kraken')Object.assign(b,{cx:VW/2,cy:5*T,r:44,vx:0,vy:0,cols:[],home:5*T});

 if(type==='arraia')Object.assign(b,{cx:VW/2,cy:6*T,ph:0,dir:1});
 b.cyc=0;
 return b;}
function bossHit(b){if(b.type==='arraia')return{x:b.cx-50,y:b.cy-18,w:100,h:36};if(b.type==='tubarao'||b.type==='lagosta'||b.type==='espada')return{x:b.x,y:b.y,w:b.w,h:b.h};if(b.type==='moreia')return{x:b.cx-22,y:b.cy-22,w:44,h:44};return{x:b.cx-b.r,y:b.cy-b.r,w:b.r*2,h:b.r*2};}

 if(b.type==='tubarao')return[{x:b.x+8,y:b.y+8,w:b.w-16,h:b.h-10}];

function damageBoss(n){const b=boss;if(!b||b.st==='intro')return;if(b.type==='lagosta'&&b.st==='guard'){const h=bossHit(b);burst(h.x+h.w/2+b.face*30,h.y+h.h/2,'#9ff',8,3);sfx('clang');if(Math.random()<.3)toast('A casca bloqueou! Espere ela baixar a guarda.',80);return;}b.hp-=n;b.flash=18;sfx('hit');const h=bossHit(b);burst(h.x+h.w/2,h.y+h.h/2,'rainbow',12,3);if(b.hp<=0)bossDie();}
